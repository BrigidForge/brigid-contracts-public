[profile.default]
src = "contracts"
out = "out"
cache_path = "cache"
libs = ["node_modules"]
optimizer = true
optimizer_runs = 200

[profile.launch]
src = "contracts"
out = "out/launch"
cache_path = "cache/launch"
skip = ["contracts/staking/**"]
solc_version = "0.8.33"
via_ir = true
evm_version = "cancun"

[profile.staking]
src = "contracts/staking"
out = "out/staking"
cache_path = "cache/staking"
solc_version = "0.8.24"
via_ir = false

[rpc_endpoints]
bsc_mainnet = "${BSC_MAINNET_RPC_URL}"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
